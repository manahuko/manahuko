<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260">
  <defs>
    <linearGradient id="bglight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#DCE5F5"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .head { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
    .card { transform-box: fill-box; transform-origin: center; opacity: 1; animation: flip 7s ease-in-out infinite; }
    @keyframes flip {
      0% { opacity: 0; transform: perspective(600px) rotateY(-70deg) translateY(10px); }
      12%, 70% { opacity: 1; transform: perspective(600px) rotateY(0deg) translateY(0); }
      85%, 100% { opacity: 0; transform: perspective(600px) rotateY(70deg) translateY(10px); }
    }
    .ring { stroke-dasharray: 126; stroke-dashoffset: 126; animation: spin 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { 0%,15% { stroke-dashoffset: 126; } 45%,100% { stroke-dashoffset: 0; } }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 7s ease-out infinite; }
    @keyframes grow { 0%,15% { transform: scaleX(0); } 45%,100% { transform: scaleX(1); } }
    .shine { opacity: 0; animation: sweep 7s ease-in-out infinite; transform-box: fill-box; }
    @keyframes sweep { 0%,40% { opacity: 0; transform: translateX(-160px); } 50% { opacity: 1; } 60%,100% { opacity: 0; transform: translateX(160px); } }
  </style>
  <rect width="840" height="260" rx="22" fill="url(#bglight)"/>
  <text class="head" x="28" y="42" font-size="22" font-weight="800" fill="#14213D">Certifications &amp; Progress</text>
  <rect x="28" y="50" width="80" height="3" rx="1.5" fill="#58A6FF"/>
  <text x="812" y="42" text-anchor="end" font-size="14" fill="#374357">2 done | 3 in progress</text>
  <g class="card" style="animation-delay:0.00s">
    <rect x="26" y="72" width="150" height="150" rx="18" fill="#FFFFFF" stroke="#D5DDEB" stroke-width="1.5"/>
    <rect x="26" y="72" width="150" height="8" rx="4" fill="#F0883E"/>
    <circle cx="101" cy="128" r="28" fill="#F0883E" opacity="0.18"/>
    <circle cx="101" cy="128" r="20" fill="none" stroke="#F0883E" stroke-width="3" class="ring"/>
    <text x="101" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#F0883E">60%</text>
    <text x="101" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">OSCP</text>
    <text x="101" y="190" text-anchor="middle" font-size="11" fill="#374357">Studying | Q2 2027</text>
    <rect x="37" y="200" width="128" height="6" rx="3" fill="#E3E9F3"/>
    <rect class="bar" x="37" y="200" width="76.8" height="6" rx="3" fill="#F0883E" style="animation-delay:0.60s"/>
    <rect class="shine" x="26" y="72" width="150" height="150" rx="18" fill="url(#sheen)" style="animation-delay:1.20s"/>
  </g>
  <g class="card" style="animation-delay:0.35s">
    <rect x="190" y="72" width="150" height="150" rx="18" fill="#FFFFFF" stroke="#D5DDEB" stroke-width="1.5"/>
    <rect x="190" y="72" width="150" height="8" rx="4" fill="#A371F7"/>
    <circle cx="265" cy="128" r="28" fill="#A371F7" opacity="0.18"/>
    <circle cx="265" cy="128" r="20" fill="none" stroke="#A371F7" stroke-width="3" class="ring"/>
    <text x="265" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#A371F7">15%</text>
    <text x="265" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">OSWE</text>
    <text x="265" y="190" text-anchor="middle" font-size="11" fill="#374357">Planned | 2027</text>
    <rect x="201" y="200" width="128" height="6" rx="3" fill="#E3E9F3"/>
    <rect class="bar" x="201" y="200" width="19.2" height="6" rx="3" fill="#A371F7" style="animation-delay:0.95s"/>
    <rect class="shine" x="190" y="72" width="150" height="150" rx="18" fill="url(#sheen)" style="animation-delay:1.55s"/>
  </g>
  <g class="card" style="animation-delay:0.70s">
    <rect x="354" y="72" width="150" height="150" rx="18" fill="#FFFFFF" stroke="#D5DDEB" stroke-width="1.5"/>
    <rect x="354" y="72" width="150" height="8" rx="4" fill="#3FB950"/>
    <circle cx="429" cy="128" r="28" fill="#3FB950" opacity="0.18"/>
    <circle cx="429" cy="128" r="20" fill="none" stroke="#3FB950" stroke-width="3" class="ring"/>
    <text x="429" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#3FB950">100%</text>
    <text x="429" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">eJPT / PNPT</text>
    <text x="429" y="190" text-anchor="middle" font-size="11" fill="#374357">Done | Achieved</text>
    <rect x="365" y="200" width="128" height="6" rx="3" fill="#E3E9F3"/>
    <rect class="bar" x="365" y="200" width="128.0" height="6" rx="3" fill="#3FB950" style="animation-delay:1.30s"/>
    <rect class="shine" x="354" y="72" width="150" height="150" rx="18" fill="url(#sheen)" style="animation-delay:1.90s"/>
  </g>
  <g class="card" style="animation-delay:1.05s">
    <rect x="518" y="72" width="150" height="150" rx="18" fill="#FFFFFF" stroke="#D5DDEB" stroke-width="1.5"/>
    <rect x="518" y="72" width="150" height="8" rx="4" fill="#3FB950"/>
    <circle cx="593" cy="128" r="28" fill="#3FB950" opacity="0.18"/>
    <circle cx="593" cy="128" r="20" fill="none" stroke="#3FB950" stroke-width="3" class="ring"/>
    <text x="593" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#3FB950">100%</text>
    <text x="593" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">CompTIA Sec+</text>
    <text x="593" y="190" text-anchor="middle" font-size="11" fill="#374357">Done | Achieved</text>
    <rect x="529" y="200" width="128" height="6" rx="3" fill="#E3E9F3"/>
    <rect class="bar" x="529" y="200" width="128.0" height="6" rx="3" fill="#3FB950" style="animation-delay:1.65s"/>
    <rect class="shine" x="518" y="72" width="150" height="150" rx="18" fill="url(#sheen)" style="animation-delay:2.25s"/>
  </g>
  <g class="card" style="animation-delay:1.40s">
    <rect x="682" y="72" width="150" height="150" rx="18" fill="#FFFFFF" stroke="#D5DDEB" stroke-width="1.5"/>
    <rect x="682" y="72" width="150" height="8" rx="4" fill="#58A6FF"/>
    <circle cx="757" cy="128" r="28" fill="#58A6FF" opacity="0.18"/>
    <circle cx="757" cy="128" r="20" fill="none" stroke="#58A6FF" stroke-width="3" class="ring"/>
    <text x="757" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#58A6FF">70%</text>
    <text x="757" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">AWS SA</text>
    <text x="757" y="190" text-anchor="middle" font-size="11" fill="#374357">Studying | Q4 2026</text>
    <rect x="693" y="200" width="128" height="6" rx="3" fill="#E3E9F3"/>
    <rect class="bar" x="693" y="200" width="89.6" height="6" rx="3" fill="#58A6FF" style="animation-delay:2.00s"/>
    <rect class="shine" x="682" y="72" width="150" height="150" rx="18" fill="url(#sheen)" style="animation-delay:2.60s"/>
  </g>
</svg>
