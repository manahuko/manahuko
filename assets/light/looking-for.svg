<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230">
  <defs>
    <linearGradient id="bglight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#DCE5F5"/></linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .row { opacity: 1; animation: slide 6s infinite; }
    @keyframes slide {
      0% { opacity: 0; transform: translateX(-24px); }
      10%, 70% { opacity: 1; transform: translateX(0); }
      85%, 100% { opacity: 0; transform: translateX(24px); }
    }
    .head { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  </style>
  <rect width="840" height="230" rx="20" fill="url(#bglight)"/>
  <text class="head" x="40" y="40" font-size="22" font-weight="800" fill="#14213D">Looking For</text>
  <rect x="40" y="48" width="70" height="3" rx="1.5" fill="#58A6FF"/>
  <g class="row" style="animation-delay:0.0s">
    <rect x="40" y="54" width="760" height="30" rx="15" fill="#FFFFFF" stroke="#D5DDEB"/>
    <circle cx="58" cy="69" r="6" fill="#58A6FF"/>
    <text x="78" y="74" font-size="17" font-weight="700" fill="#14213D">Research Collaboration</text>
    <text x="330" y="74" font-size="15" fill="#374357">AI x Security</text>
  </g>
  <g class="row" style="animation-delay:0.6s">
    <rect x="40" y="92" width="760" height="30" rx="15" fill="#FFFFFF" stroke="#D5DDEB"/>
    <circle cx="58" cy="107" r="6" fill="#3FB950"/>
    <text x="78" y="112" font-size="17" font-weight="700" fill="#14213D">Bug Bounty Programs</text>
    <text x="330" y="112" font-size="15" fill="#374357">testing and reporting bugs</text>
  </g>
  <g class="row" style="animation-delay:1.2s">
    <rect x="40" y="130" width="760" height="30" rx="15" fill="#FFFFFF" stroke="#D5DDEB"/>
    <circle cx="58" cy="145" r="6" fill="#F0883E"/>
    <text x="78" y="150" font-size="17" font-weight="700" fill="#14213D">Internship / Part-time</text>
    <text x="330" y="150" font-size="15" fill="#374357">SecOps, Platform, Backend teams</text>
  </g>
  <g class="row" style="animation-delay:1.8s">
    <rect x="40" y="168" width="760" height="30" rx="15" fill="#FFFFFF" stroke="#D5DDEB"/>
    <circle cx="58" cy="183" r="6" fill="#D2A8FF"/>
    <text x="78" y="188" font-size="17" font-weight="700" fill="#14213D">Open Source Contribution</text>
    <text x="330" y="188" font-size="15" fill="#374357">security tools and automation</text>
  </g>
</svg>
