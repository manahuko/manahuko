<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260">
  <defs>
    <linearGradient id="bgdark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#161E33"/></linearGradient>
    <linearGradient id="nmdark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4F7FB"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
    <filter id="glowdark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="fldark" cx="0.7" cy="0.5" r="0.5"><stop offset="0" stop-color="#7DD3FC" stop-opacity="0.45"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .flash { animation: flash 4.5s infinite; }
    @keyframes flash { 0%,60%,66%,100% {opacity:0;} 62% {opacity:1;} 64% {opacity:.35;} }
    .b1 { animation: strike 4.5s infinite; }
    .b2 { animation: strike 4.5s infinite; animation-delay: .9s; }
    .b3 { animation: strike 4.5s infinite; animation-delay: 2.2s; }
    @keyframes strike { 0%,58%,72%,100% {opacity:0;} 60% {opacity:1;} 63% {opacity:.2;} 66% {opacity:1;} 69% {opacity:0;} }
    .line { opacity: 1; animation: show 9s infinite; }
    .line2 { animation: show2 9s infinite; }
    @keyframes show2 { 0%,30%{opacity:0;} 38%,100%{opacity:1;} }
    .cursor { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="840" height="260" rx="22" fill="url(#bgdark)"/>
  <ellipse class="flash" cx="600" cy="130" rx="260" ry="150" fill="url(#fldark)"/>
  <g filter="url(#glowdark)" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <polyline class="b1" points="560,20 520,120 552,120 508,240 600,100 566,100 610,20"/>
    <polyline class="b2" points="700,30 672,110 698,110 664,230 740,96 712,96 748,30"/>
    <polyline class="b3" points="470,60 452,120 474,120 448,200 512,116 488,116 516,60"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <polyline class="b1" points="560,20 520,120 552,120 508,240 600,100 566,100 610,20"/>
    <polyline class="b2" points="700,30 672,110 698,110 664,230 740,96 712,96 748,30"/>
    <polyline class="b3" points="470,60 452,120 474,120 448,200 512,116 488,116 516,60"/>
  </g>
  <text x="48" y="92" font-size="44" font-weight="800" fill="url(#nmdark)">Alireza Bakhari</text>
  <text x="48" y="130" font-size="20" font-weight="600" fill="#B8C4DA">Computer Science Student @ University of Oxford</text>
  <text class="line2" x="48" y="158" font-size="18" font-weight="600" fill="#B8C4DA">Python Developer | Linux | Networking | Cybersecurity</text>
  <text x="48" y="186" font-size="16" fill="#B8C4DA" opacity="0.9">AI &amp; Automation with n8n<tspan class="cursor"> |</tspan></text>
  <rect x="48" y="206" width="150" height="32" rx="16" fill="#7DD3FC"/>
  <text x="123" y="227" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Open Source</text>
  <rect x="210" y="206" width="170" height="32" rx="16" fill="#1E9C7A"/>
  <text x="295" y="227" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bug Bounty Hunter</text>
</svg>
